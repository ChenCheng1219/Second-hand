<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Second-hand Platform</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: #f4f7f6 url("{{ url_for('static', filename='1.png') }}") no-repeat center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            min-height: 100vh;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .login-box h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-family: inherit;
            transition: background 0.3s;
        }

        .login-box button:hover {
            background: #e64a19;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-bottom: 10px;
            background: rgba(255, 0, 0, 0.1);
            padding: 5px;
            border-radius: 3px;
        }

        .register-link {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
        }

        .register-link:hover {
            color: #ff5722;
            text-decoration: underline;
        }

        .home-link {
            display: block;
            margin-top: 10px;
            text-decoration: none;
            color: #999;
            font-size: 12px;
        }

        .home-link:hover {
            color: #ff5722;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="error">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
        <input type="text" name="username" placeholder="Username" autocomplete="new-password" required>
        <input type="password" name="password" placeholder="Password" autocomplete="new-password" required>
        <button type="submit">Login</button>
    </form>

    <a href="{{ url_for('register') }}" class="register-link">Don't have an account? Register</a>
    <a href="/" class="home-link"><i class="fas fa-home"></i> Back to Home</a>
</div>

</body>
</html>
